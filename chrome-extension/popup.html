<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>

<body>
<header class="top">

  <div class="brand"><b>Parano<em>1</em>d World</b><small id="site"></small></div>

    <button id="paranoid" class="para" role="switch" aria-checked="false" type="button">Paranoid</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<nav id="nav" class="nav" aria-label="Sections"></nav>
